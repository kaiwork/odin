<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">Classic 3-in-a-row strategy</p>
    </header>

    <div class="setup-panel">
      <div class="player-input-group">
        <label for="p1-name">Player 1 (X)</label>
        <input type="text" id="p1-name" value="Player One" placeholder="Enter name">
      </div>
      <div class="player-input-group">
        <label for="p2-name">Player 2 (O)</label>
        <input type="text" id="p2-name" value="Player Two" placeholder="Enter name">
      </div>
      <button id="start-btn" class="btn btn-primary">Update Names / Restart</button>
    </div>

    <div class="turn-indicator" id="turn-status">
      Player One's Turn (X)
    </div>

    <div class="board-container">
      <div class="game-board" id="board">
        <!-- Cells generated dynamically -->
      </div>
    </div>

    <div class="controls">
      <button id="reset-btn" class="btn btn-secondary">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
